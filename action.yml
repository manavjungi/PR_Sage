name: 'PR Sage - AI Code Review'
description: 'RAG-powered AI code review for pull requests, using Gemini'
author: 'Manav Jungi'

inputs:
  gemini-api-key:
    description: 'Your Gemini API key'
    required: true
  github-token:
    description: 'Token used to post the review comment'
    required: false
    default: ${{ github.token }}
  top-k:
    description: 'Number of related code chunks to retrieve as context'
    required: false
    default: '3'

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Set up Python
      shell: bash
      working-directory: ${{ github.action_path }}
      run: uv python install

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: uv sync

    - name: Run AI review
      shell: bash
      working-directory: ${{ github.action_path }}/src/pr_sage
      env:
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        TARGET_REPO_PATH: ${{ github.workspace }}
        TOP_K: ${{ inputs.top-k }}
      run: uv run python review.py